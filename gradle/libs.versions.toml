[versions]
paper = "26.2.build.+"
placeholderApi = "2.12.3"
jspecify = "1.0.1"

acf = "0.5.1-SNAPSHOT"
configlib = "4.8.1"
jackson = "2.22.0"
hikari = "7.1.0"
invui = "2.3.2"

sqliteJdbc = "3.53.4.0"
mariadb = "3.5.10"

lombok = "9.5.0"
shadow = "9.6.1"
resource-factory = "1.3.1"

[libraries]
paperApi = { module = "io.papermc.paper:paper-api", version.ref = "paper" }
placeholderApi = { module = "me.clip:placeholderapi", version.ref = "placeholderApi" }
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }

acfPaper = { module = "co.aikar:acf-paper", version.ref = "acf" }
configlibYaml = { module = "de.exlll:configlib-yaml", version.ref = "configlib" }
jacksonDatabind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
jacksonJsr310 = { module = "com.fasterxml.jackson.datatype:jackson-datatype-jsr310", version.ref = "jackson" }
hikari = { module = "com.zaxxer:HikariCP", version.ref = "hikari" }
invui = { module = "xyz.xenondevs.invui:invui", version.ref = "invui" }

sqliteJdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqliteJdbc" }
mariadbJdbc = { module = "org.mariadb.jdbc:mariadb-java-client", version.ref = "mariadb" }

[plugins]
lombok = { id = "io.freefair.lombok", version.ref = "lombok" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
resourceFactoryPaperConvention = { id = "xyz.jpenilla.resource-factory-paper-convention", version.ref = "resource-factory" }
resourceFactoryBukkitConvention = { id = "xyz.jpenilla.resource-factory-bukkit-convention", version.ref = "resource-factory" }
